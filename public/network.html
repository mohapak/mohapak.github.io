<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Board Network Visualization</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --bg-card: #18181b;
      --bg-hover: #27272a;
      --border: #27272a;
      --border-hover: #3f3f46;
      --text: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #6366f1;
      --accent-dim: rgba(99, 102, 241, 0.15);
      --success: #22c55e;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1rem;
    }

    .header-title h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-title p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    /* Container */
    .container {
      flex: 1;
      display: flex;
      padding: 1rem;
      gap: 1rem;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }

    /* Main */
    .main {
      flex: 1;
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 550px;
      position: relative;
      contain: layout style;
    }

    /* Toolbar */
    .toolbar {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Form Controls */
    .select-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: border-color 0.15s;
    }

    .select-wrap:hover,
    .select-wrap:focus-within {
      border-color: var(--accent);
    }

    .select-wrap label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 500;
    }

    .select-wrap select {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }

    .select-wrap select option {
      background: var(--bg-card);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      min-width: 180px;
      transition: border-color 0.15s;
    }

    .search-box:focus-within {
      border-color: var(--accent);
    }

    .search-box svg {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      min-width: 0;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      padding: 0.5rem 0.875rem;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .btn:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: var(--border-hover);
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-icon {
      padding: 0.5rem;
      width: 36px;
      height: 36px;
    }

    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* Network */
    #network {
      flex: 1;
      width: 100%;
      background: var(--bg);
      cursor: grab;
      display: block;
    }

    #network:active {
      cursor: grabbing;
    }

    /* Year Badge */
    .year-badge {
      position: absolute;
      top: 4rem;
      left: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 1.5rem;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .year-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
    }

    /* Zoom Controls */
    .zoom-controls {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 10;
    }

    .zoom-btn {
      width: 32px;
      height: 32px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1.25rem;
      font-weight: 300;
      transition: all 0.15s;
    }

    .zoom-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    /* Node Details */
    .node-panel {
      position: absolute;
      top: 4rem;
      right: 1rem;
      width: 260px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      z-index: 20;
      opacity: 0;
      visibility: hidden;
      transform: translateX(10px);
      transition: all 0.2s;
    }

    .node-panel.visible {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
    }

    .node-panel-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .node-panel-title {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .node-panel-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .node-panel-close {
      width: 24px;
      height: 24px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .node-panel-close:hover {
      background: #ef4444;
      border-color: #ef4444;
      color: white;
    }

    .node-panel-body {
      padding: 1rem;
    }

    .section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .metric-bar {
      margin-bottom: 0.625rem;
    }

    .metric-bar:last-child {
      margin-bottom: 0;
    }

    .metric-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }

    .metric-label {
      color: var(--text-secondary);
    }

    .metric-value {
      font-weight: 600;
    }

    .metric-track {
      height: 4px;
      background: var(--bg);
      border-radius: 2px;
    }

    .metric-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s;
    }

    /* Sidebar */
    .sidebar {
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .card-header {
      padding: 0.875rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .card-header h3 {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-header svg {
      width: 16px;
      height: 16px;
      color: var(--accent);
    }

    .card-body {
      padding: 1rem;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.625rem;
    }

    .stat {
      background: var(--bg);
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      transition: border-color 0.15s;
    }

    .stat:hover {
      border-color: var(--border);
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* Legend */
    .legend {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 180px;
      overflow-y: auto;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .legend-item:hover {
      background: var(--bg);
    }

    .legend-item.active {
      background: var(--accent-dim);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .legend-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .legend-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Help */
    .help-item {
      display: flex;
      gap: 0.625rem;
      align-items: flex-start;
      margin-bottom: 0.625rem;
    }

    .help-item:last-child {
      margin-bottom: 0;
    }

    .help-icon {
      width: 26px;
      height: 26px;
      background: var(--bg);
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .help-text {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .help-text strong {
      color: var(--text);
      font-weight: 500;
    }

    /* Tooltip */
    .tooltip {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      max-width: 280px;
      z-index: 1000;
      transition: opacity 0.1s;
    }

    .tooltip-type {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .tooltip-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .tooltip-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
    }

    .tooltip-row:last-child {
      border-bottom: none;
    }

    .tooltip-label {
      color: var(--text-muted);
    }

    .tooltip-value {
      font-weight: 600;
    }

    /* Loading */
    .loading {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Responsive */
    @media (max-width: 1024px) {
      .container { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; }
      .card { flex: 1; min-width: 260px; }
    }

    @media (max-width: 768px) {
      .header { flex-wrap: wrap; padding: 0.75rem 1rem; }
      .header-actions { display: none; }
      .toolbar { flex-direction: column; }
      .toolbar-group { width: 100%; justify-content: center; }
      .search-box { width: 100%; }
      .card { min-width: 100%; }
      .node-panel {
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        border-radius: var(--radius) var(--radius) 0 0;
        transform: translateY(100%);
      }
      .node-panel.visible { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <div class="logo">B</div>
      <div class="header-title">
        <h1>Board Directors Network</h1>
        <p>Tehran Stock Exchange</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" id="exportBtn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Export
      </button>
      <button class="btn btn-primary" id="fullscreenBtn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
        Fullscreen
      </button>
    </div>
  </header>

  <main class="container">
    <section class="main">
      <div class="toolbar">
        <div class="toolbar-group">
          <div class="select-wrap">
            <label>Year</label>
            <select id="yearSelect">
              <option value="2016">2016</option>
              <option value="2017">2017</option>
              <option value="2018">2018</option>
              <option value="2019">2019</option>
              <option value="2020">2020</option>
              <option value="2021">2021</option>
              <option value="2022">2022</option>
              <option value="2023">2023</option>
              <option value="2024" selected>2024</option>
            </select>
          </div>
          <div class="search-box">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="searchInput" placeholder="Search firms...">
          </div>
        </div>
        <div class="toolbar-group">
          <button class="btn btn-icon" id="resetBtn" title="Reset">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>
          <button class="btn btn-icon" id="playBtn" title="Restart Layout">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </button>
        </div>
      </div>

      <div class="year-badge" id="yearBadge">2024</div>

      <svg id="network"></svg>

      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomIn">+</button>
        <button class="zoom-btn" id="zoomOut">−</button>
        <button class="zoom-btn" id="zoomFit">⊡</button>
      </div>

      <div class="node-panel" id="nodePanel">
        <div class="node-panel-header">
          <div>
            <div class="node-panel-title" id="panelTitle">Firm</div>
            <div class="node-panel-subtitle" id="panelSubtitle">Sector</div>
          </div>
          <button class="node-panel-close" id="panelClose">✕</button>
        </div>
        <div class="node-panel-body">
          <div class="section-title">Centrality Metrics</div>
          <div id="metricsContainer"></div>
        </div>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading network...</div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="card">
        <div class="card-header">
          <h3>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            Statistics
          </h3>
        </div>
        <div class="card-body">
          <div class="stats">
            <div class="stat">
              <div class="stat-label">Firms</div>
              <div class="stat-value" id="statNodes">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">Interlocks</div>
              <div class="stat-value" id="statLinks">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">Avg Degree</div>
              <div class="stat-value" id="statDegree">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">Density</div>
              <div class="stat-value" id="statDensity">0%</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
            Sectors
          </h3>
        </div>
        <div class="card-body">
          <div class="legend" id="legend"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Controls
          </h3>
        </div>
        <div class="card-body">
          <div class="help-item">
            <div class="help-icon">🖱️</div>
            <div class="help-text"><strong>Drag</strong> nodes to move</div>
          </div>
          <div class="help-item">
            <div class="help-icon">🔍</div>
            <div class="help-text"><strong>Scroll</strong> to zoom</div>
          </div>
          <div class="help-item">
            <div class="help-icon">👆</div>
            <div class="help-text"><strong>Click</strong> for details</div>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <div class="tooltip" id="tooltip"></div>

  <script>
    // State
    let year = '2024';
    let sim = null;
    let data = null;
    let svg, g, zoom;
    let selectedNode = null;
    let activeSector = null;

    // Elements
    const $ = id => document.getElementById(id);
    const tooltip = $('tooltip');
    const loading = $('loading');
    const nodePanel = $('nodePanel');

    // Utilities
    const fmt = (v, d = 3) => v != null && isFinite(v) ? v.toFixed(d) : '—';
    const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

    // Centrality computation (optimized)
    function computeCentralities(nodes, links) {
      const n = nodes.length;
      if (!n) return;

      const idMap = new Map(nodes.map((node, i) => [node.id, i]));
      const getIdx = ref => typeof ref === 'object' ? idMap.get(ref.id) : idMap.get(ref);

      // Adjacency
      const adj = Array.from({ length: n }, () => []);
      links.forEach(l => {
        const u = getIdx(l.source), v = getIdx(l.target);
        if (u != null && v != null && u !== v) {
          adj[u].push(v);
          adj[v].push(u);
        }
      });

      // Degree
      const degree = adj.map(a => a.length);

      // Closeness & Betweenness (combined BFS)
      const closeness = new Float32Array(n);
      const betweenness = new Float32Array(n);

      for (let s = 0; s < n; s++) {
        const dist = new Int16Array(n).fill(-1);
        const sigma = new Float32Array(n);
        const pred = Array.from({ length: n }, () => []);
        const stack = [];
        const queue = [s];
        let head = 0;

        dist[s] = 0;
        sigma[s] = 1;

        while (head < queue.length) {
          const v = queue[head++];
          stack.push(v);
          for (const w of adj[v]) {
            if (dist[w] < 0) {
              dist[w] = dist[v] + 1;
              queue.push(w);
            }
            if (dist[w] === dist[v] + 1) {
              sigma[w] += sigma[v];
              pred[w].push(v);
            }
          }
        }

        let distSum = 0, reachable = 0;
        for (let i = 0; i < n; i++) {
          if (dist[i] > 0) { distSum += dist[i]; reachable++; }
        }
        closeness[s] = distSum > 0 ? reachable / distSum : 0;

        const delta = new Float32Array(n);
        while (stack.length) {
          const w = stack.pop();
          for (const v of pred[w]) {
            delta[v] += (sigma[v] / sigma[w]) * (1 + delta[w]);
          }
          if (w !== s) betweenness[w] += delta[w];
        }
      }

      // Eigenvector (power iteration)
      let eigen = new Float32Array(n).fill(1 / n);
      for (let iter = 0; iter < 50; iter++) {
        const next = new Float32Array(n);
        for (let v = 0; v < n; v++) {
          for (const w of adj[v]) next[v] += eigen[w];
        }
        let norm = Math.sqrt(next.reduce((a, b) => a + b * b, 0));
        if (norm === 0) break;
        for (let i = 0; i < n; i++) next[i] /= norm;
        let diff = 0;
        for (let i = 0; i < n; i++) diff += Math.abs(next[i] - eigen[i]);
        eigen = next;
        if (diff < 1e-6) break;
      }

      // Normalize and assign
      const maxD = Math.max(...degree, 1);
      const maxC = Math.max(...closeness, 0.001);
      const maxB = Math.max(...betweenness, 0.001);
      const maxE = Math.max(...eigen, 0.001);

      nodes.forEach((node, i) => {
        node.centrality = {
          degree: degree[i],
          degreeNorm: degree[i] / maxD,
          closeness: closeness[i],
          closenessNorm: closeness[i] / maxC,
          betweenness: betweenness[i],
          betweennessNorm: betweenness[i] / maxB,
          eigenvector: eigen[i],
          eigenNorm: eigen[i] / maxE
        };
        node.neighbors = adj[i];
      });
    }

    // Tooltip
    function showTooltip(e, html) {
      tooltip.innerHTML = html;
      tooltip.style.opacity = 1;
      positionTooltip(e);
    }

    function positionTooltip(e) {
      const rect = tooltip.getBoundingClientRect();
      let x = e.pageX + 15, y = e.pageY + 15;
      if (x + rect.width > window.innerWidth - 10) x = e.pageX - rect.width - 15;
      if (y + rect.height > window.innerHeight - 10) y = e.pageY - rect.height - 15;
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
    }

    function hideTooltip() {
      tooltip.style.opacity = 0;
    }

    // Node Panel
    function showPanel(d) {
      selectedNode = d;
      nodePanel.classList.add('visible');
      $('panelTitle').textContent = d.label || d.id;
      $('panelSubtitle').textContent = d.sector || 'Unknown';

      const c = d.centrality || {};
      $('metricsContainer').innerHTML = [
        ['Degree', c.degree, c.degreeNorm],
        ['Closeness', fmt(c.closeness), c.closenessNorm],
        ['Betweenness', fmt(c.betweenness), c.betweennessNorm],
        ['Eigenvector', fmt(c.eigenvector), c.eigenNorm]
      ].map(([label, value, norm]) => `
        <div class="metric-bar">
          <div class="metric-header">
            <span class="metric-label">${label}</span>
            <span class="metric-value">${value}</span>
          </div>
          <div class="metric-track">
            <div class="metric-fill" style="width:${(norm || 0) * 100}%"></div>
          </div>
        </div>
      `).join('');

      highlightNode(d);
    }

    function hidePanel() {
      selectedNode = null;
      nodePanel.classList.remove('visible');
      resetHighlight();
    }

    function highlightNode(d) {
      if (!data) return;
      const neighbors = new Set(d.neighbors || []);
      const idx = data.nodes.indexOf(d);

      g.selectAll('.node circle')
        .attr('opacity', n => data.nodes.indexOf(n) === idx || neighbors.has(data.nodes.indexOf(n)) ? 1 : 0.12);
      g.selectAll('.link')
        .attr('opacity', l => data.nodes.indexOf(l.source) === idx || data.nodes.indexOf(l.target) === idx ? 0.8 : 0.03)
        .attr('stroke', l => data.nodes.indexOf(l.source) === idx || data.nodes.indexOf(l.target) === idx ? '#6366f1' : '#52525b');
    }

    function resetHighlight() {
      if (!g) return;
      g.selectAll('.node circle').attr('opacity', 1);
      g.selectAll('.link').attr('opacity', 0.4).attr('stroke', '#52525b');
    }

    // Legend
    function buildLegend() {
      const sectors = {};
      data.nodes.forEach(n => {
        const s = n.sector || 'Unknown';
        sectors[s] = sectors[s] || { color: n.color || '#6366f1', count: 0 };
        sectors[s].count++;
      });

      const sorted = Object.entries(sectors).sort((a, b) => b[1].count - a[1].count);
      $('legend').innerHTML = sorted.map(([name, { color, count }]) => `
        <div class="legend-item" data-sector="${name}">
          <div class="legend-dot" style="background:${color}"></div>
          <div class="legend-label">${name}</div>
          <div class="legend-count">${count}</div>
        </div>
      `).join('');

      $('legend').addEventListener('click', e => {
        const item = e.target.closest('.legend-item');
        if (!item) return;
        const sector = item.dataset.sector;
        
        if (activeSector === sector) {
          activeSector = null;
          item.classList.remove('active');
          resetHighlight();
        } else {
          activeSector = sector;
          $('legend').querySelectorAll('.legend-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          highlightSector(sector);
        }
      });
    }

    function highlightSector(sector) {
      g.selectAll('.node circle').attr('opacity', n => (n.sector || 'Unknown') === sector ? 1 : 0.12);
      g.selectAll('.link').attr('opacity', l => 
        (l.source.sector || 'Unknown') === sector || (l.target.sector || 'Unknown') === sector ? 0.4 : 0.03
      );
    }

    // Search
    $('searchInput').addEventListener('input', debounce(e => {
      const term = e.target.value.toLowerCase();
      if (!term) return resetHighlight();
      
      g.selectAll('.node circle').attr('opacity', n => 
        (n.label || n.id || '').toLowerCase().includes(term) ? 1 : 0.12
      );
      g.selectAll('.link').attr('opacity', 0.05);
    }, 150));

    // Load data
    function loadYear(yr) {
      year = yr;
      hideTooltip();
      hidePanel();
      activeSector = null;
      $('searchInput').value = '';
      loading.style.display = 'flex';
      $('yearBadge').textContent = yr;

      if (sim) sim.stop();
      d3.select('#network').selectAll('*').remove();

      d3.json(`/data/board_network_${yr}_no_isolates.json`)
        .then(d => {
          if (!d?.nodes?.length) throw new Error('No data');
          
          computeCentralities(d.nodes, d.links);
          data = d;
          loading.style.display = 'none';

          // Stats
          const n = d.nodes.length, l = d.links.length;
          $('statNodes').textContent = n;
          $('statLinks').textContent = l;
          $('statDegree').textContent = n ? (l * 2 / n).toFixed(1) : '0';
          $('statDensity').textContent = n > 1 ? ((l / (n * (n - 1) / 2)) * 100).toFixed(1) + '%' : '0%';

          buildLegend();
          renderNetwork();
        })
        .catch(err => {
          loading.querySelector('.loading-text').textContent = 'Failed to load data';
          loading.querySelector('.spinner').style.display = 'none';
          console.error(err);
        });
    }

    // Render
    function renderNetwork() {
      const container = document.querySelector('.main');
      const width = container.clientWidth;
      const height = container.clientHeight - 52;

      svg = d3.select('#network')
        .attr('viewBox', `0 0 ${width} ${height}`)
        .attr('width', '100%')
        .attr('height', '100%');

      // Size scale
      const getSize = d => d.centrality?.degree ?? 5;
      const sizes = data.nodes.map(getSize);
      const rScale = d3.scaleSqrt()
        .domain([Math.min(...sizes), Math.max(...sizes)])
        .range([3, 20]);

      g = svg.append('g');

      // Links
      const links = g.append('g')
        .selectAll('line')
        .data(data.links)
        .join('line')
        .attr('class', 'link')
        .attr('stroke', '#52525b')
        .attr('stroke-opacity', 0.4)
        .attr('stroke-width', d => Math.sqrt(d.weight || 1));

      // Nodes
      const nodes = g.append('g')
        .selectAll('g')
        .data(data.nodes)
        .join('g')
        .attr('class', 'node')
        .call(d3.drag()
          .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
          .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
          .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

      nodes.append('circle')
        .attr('r', d => rScale(getSize(d)))
        .attr('fill', d => d.color || '#6366f1')
        .attr('stroke', 'rgba(255,255,255,0.15)')
        .attr('stroke-width', 1.5)
        .style('cursor', 'pointer');

      // Labels (visible on zoom)
      const labels = nodes.append('text')
        .text(d => d.label || d.id)
        .attr('x', d => rScale(getSize(d)) + 6)
        .attr('y', 3)
        .attr('font-size', 10)
        .attr('fill', 'rgba(255,255,255,0.7)')
        .attr('opacity', 0)
        .style('pointer-events', 'none');

      // Zoom
      zoom = d3.zoom()
        .scaleExtent([0.1, 8])
        .on('zoom', e => {
          g.attr('transform', e.transform);
          labels.attr('opacity', e.transform.k > 1.5 ? 1 : 0);
        });

      svg.call(zoom);

      // Events
      nodes
        .on('mouseenter', (e, d) => {
          const c = d.centrality || {};
          showTooltip(e, `
            <div class="tooltip-type">Firm</div>
            <div class="tooltip-title">${d.label || d.id}</div>
            <div class="tooltip-row"><span class="tooltip-label">Degree</span><span class="tooltip-value">${c.degree ?? '—'}</span></div>
            <div class="tooltip-row"><span class="tooltip-label">Closeness</span><span class="tooltip-value">${fmt(c.closeness)}</span></div>
            <div class="tooltip-row"><span class="tooltip-label">Betweenness</span><span class="tooltip-value">${fmt(c.betweenness)}</span></div>
          `);
        })
        .on('mousemove', positionTooltip)
        .on('mouseleave', hideTooltip)
        .on('click', (e, d) => { e.stopPropagation(); hideTooltip(); showPanel(d); });

      links
        .on('mouseenter', (e, d) => {
          showTooltip(e, `
            <div class="tooltip-type">Interlock</div>
            <div class="tooltip-title">${d.source.label || d.source.id} ↔ ${d.target.label || d.target.id}</div>
            <div class="tooltip-row"><span class="tooltip-label">Shared Directors</span><span class="tooltip-value">${d.weight || 1}</span></div>
          `);
        })
        .on('mousemove', positionTooltip)
        .on('mouseleave', hideTooltip);

      svg.on('click', hidePanel);

      // Simulation
      sim = d3.forceSimulation(data.nodes)
        .force('link', d3.forceLink(data.links).id(d => d.id).distance(50).strength(0.4))
        .force('charge', d3.forceManyBody().strength(-80).distanceMax(300))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(d => rScale(getSize(d)) + 2))
        .velocityDecay(0.4)
        .alphaDecay(0.02);

      sim.on('tick', () => {
        links
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);
        nodes.attr('transform', d => `translate(${d.x},${d.y})`);
      });

      // Resize
      const resize = debounce(() => {
        const w = container.clientWidth, h = container.clientHeight - 52;
        svg.attr('viewBox', `0 0 ${w} ${h}`);
        sim.force('center', d3.forceCenter(w / 2, h / 2)).alpha(0.3).restart();
      }, 200);
      window.addEventListener('resize', resize);
    }

    // Fit to view
    function fitView() {
      if (!data?.nodes.length) return;
      const container = document.querySelector('.main');
      const width = container.clientWidth, height = container.clientHeight - 52;

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      data.nodes.forEach(d => {
        if (d.x < minX) minX = d.x;
        if (d.x > maxX) maxX = d.x;
        if (d.y < minY) minY = d.y;
        if (d.y > maxY) maxY = d.y;
      });

      const pad = 40;
      const scale = Math.min(width / (maxX - minX + pad * 2), height / (maxY - minY + pad * 2), 2) * 0.85;
      const tx = width / 2 - ((minX + maxX) / 2) * scale;
      const ty = height / 2 - ((minY + maxY) / 2) * scale;

      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
    }

    // Events
    $('yearSelect').addEventListener('change', e => loadYear(e.target.value));
    $('panelClose').addEventListener('click', hidePanel);
    $('resetBtn').addEventListener('click', () => {
      hidePanel();
      activeSector = null;
      $('legend').querySelectorAll('.legend-item').forEach(i => i.classList.remove('active'));
      $('searchInput').value = '';
      resetHighlight();
      svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);
    });
    $('playBtn').addEventListener('click', () => sim?.alpha(1).restart());
    $('zoomIn').addEventListener('click', () => svg.transition().duration(200).call(zoom.scaleBy, 1.5));
    $('zoomOut').addEventListener('click', () => svg.transition().duration(200).call(zoom.scaleBy, 0.67));
    $('zoomFit').addEventListener('click', fitView);
    $('fullscreenBtn').addEventListener('click', () => {
      document.fullscreenElement ? document.exitFullscreen() : document.querySelector('.main').requestFullscreen();
    });
    $('exportBtn').addEventListener('click', () => {
      const svgEl = $('network');
      const blob = new Blob([new XMLSerializer().serializeToString(svgEl)], { type: 'image/svg+xml' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `network_${year}.svg`;
      link.click();
    });

    // Init
    loadYear('2024');
  </script>
</body>
</html>
